[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research-automation"
version = "0.1.0"
description = "Enterprise-grade multi-agent research & automation system: planner/researcher/analyst/writer/critic agents over pluggable source connectors, with citation-verified reports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Multi-Agent Research Automation Contributors" }]
keywords = ["multi-agent", "research", "orchestration", "rag", "citations", "fastapi"]
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
research-system = "research_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_system = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
