# GitHub Actions CI for this project.
#
# NOTE: this file lives under docs/ on purpose. To activate it, move it to
# .github/workflows/ci.yml in the repository — GitHub only discovers
# workflow files in that location.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Smoke-test the CLI demo
        run: |
          python -m research_system.cli \
            "How can we reduce cloud infrastructure costs without hurting reliability?" \
            --out out/
          test -s out/report.md
          test -s out/report.json
